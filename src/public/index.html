<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Produtos e Contas Financeiras</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="ds-container">
    <h1 class="ds-title">Produtos e Contas Financeiras</h1>
    <p id="status" class="ds-helper" role="status">Aguardando contexto do Salesforce…</p>
    <div class="ds-table-wrapper" id="tableWrapper" hidden>
      <table class="ds-table">
        <caption class="sr-only">Contas financeiras do cliente</caption>
        <thead>
          <tr>
            <th scope="col">Número</th>
            <th scope="col">Categoria</th>
            <th scope="col">Produto</th>
            <th scope="col">Modalidade</th>
            <th scope="col">Status</th>
            <th scope="col">Tipo</th>
            <th scope="col" class="num">Valor</th>
            <th scope="col">Condições principais</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </main>
  <script src="app.js"></script>
</body>
</html>
